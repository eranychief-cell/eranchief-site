name: Notify Bing (IndexNow) after deploy
# Bing powers much of ChatGPT search. After each push the Cloudflare build deploys the site; this then tells
# Bing/IndexNow which URLs exist so new and changed pages are picked up quickly. The key file is public by design.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new version to be live
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://eranchief.com/a7d8eb0f35e3bd466bee048ca351acef.txt | grep -q a7d8eb0f35e3bd466bee048ca351acef; then echo live; break; fi
            sleep 20
          done
          sleep 60
      - name: Submit sitemap URLs to IndexNow
        run: |
          curl -fsS -A "Mozilla/5.0 (IndexNow submitter; eranchief.com)" https://eranchief.com/sitemap.xml -o sitemap.xml
          python3 - <<'PY'
          import json, re
          xml = open('sitemap.xml', encoding='utf-8').read()
          urls = sorted(set(re.findall(r'<loc>(https://eranchief\.com[^<]*)</loc>', xml)))[:10000]
          print(len(urls), 'urls')
          json.dump({"host": "eranchief.com", "key": "a7d8eb0f35e3bd466bee048ca351acef", "keyLocation": "https://eranchief.com/a7d8eb0f35e3bd466bee048ca351acef.txt", "urlList": urls}, open('body.json', 'w'))
          PY
          code=$(curl -sS -o resp.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data @body.json https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $code"; cat resp.txt; echo
          case "$code" in 200|202) ;; *) exit 1;; esac
