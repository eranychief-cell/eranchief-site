name: live-check-heart
on:
  push:
    branches: [tmp/live-check-heart]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 10
          for u in https://eranchief.com/he/jaffa-15-years/ https://eranchief.com/jaffa-15-years/ https://eranchief.com/he/jaffa-15-years/journey/ https://eranchief.com/jaffa-15-years/journey/ https://eranchief.com/artworks/the-heart-of-the-storm-218/ https://eranchief.com/he/artworks/the-heart-of-the-storm-218/ https://eranchief.com/jaffa-15-years/img/thumb/jaffa-2026-heart-of-the-storm.jpg https://eranchief.com/assets/work_218_the_heart_of_the_storm.jpg; do
            code=$(curl -s -o /tmp/p -w '%{http_code}' -H 'Cache-Control: no-cache' "$u?v=$RANDOM")
            n1=$(grep -c 'heart-of-the-storm' /tmp/p || true)
            n2=$(grep -o 'לב הסערה\|The Heart of the Storm' /tmp/p | sort | uniq -c | tr '\n' ' ')
            n3=$(grep -o '47</b>\|data-to="47"\|4 צילומים\|4 photographs\|₪990' /tmp/p | sort | uniq -c | tr '\n' ' ')
            echo "::notice::$u code=$code refs=$n1 titles=[$n2] counts=[$n3]"
          done
          curl -s https://eranchief.com/sitemap.xml | grep -o 'the-heart-of-the-storm-218' | wc -l | xargs -I{} echo "::notice::sitemap heart urls={}"
