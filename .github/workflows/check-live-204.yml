name: check-live-204
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do
            c=$(curl -s -o /dev/null -w "%{http_code}" https://eranchief.com/assets/behind-the-gentle-keeper.mp4)
            [ "$c" = "200" ] && break; sleep 15
          done
          echo "::notice::video -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://eranchief.com/assets/behind-the-gentle-keeper.mp4)"
          echo "::notice::work55 HE has video: $(curl -s https://eranchief.com/he/artworks/the-gentle-keeper-55/ | grep -c behind-the-gentle-keeper.mp4)"
          echo "::notice::work55 EN has video: $(curl -s https://eranchief.com/artworks/the-gentle-keeper-55/ | grep -c behind-the-gentle-keeper.mp4)"
          echo "::notice::btf HE cards: $(curl -s https://eranchief.com/he/behind-the-frame/ | grep -o 'class=\"behind-card' | wc -l)"
          echo "::notice::sitemap btf: $(curl -s https://eranchief.com/sitemap.xml | grep -c behind-the-frame)"
