name: diag-film
on:
  push:
    branches: [diag-film-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe live site
        run: |
          U=https://eranchief.com
          echo "::notice title=homepage film tag::$(curl -s "$U/" | grep -o '<video id="paperFilm"[^>]*>' | head -1)"
          for p in /assets/paper-edition-film-oct-v2-lite.mp4 /assets/lobbies-film-lite.mp4; do
            echo "::notice title=GET $p::$(curl -s -o /dev/null -D - "$U$p" | tr -d '\r' | grep -i -E '^HTTP|content-type|content-length' | tr '\n' ' ')"
          done
