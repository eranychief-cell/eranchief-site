name: diag-film
on:
  push:
    branches: [diag-film-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe live site
        run: |
          U=https://eranchief.com
          h=$(curl -s "$U/")
          echo "::notice title=film::$(echo "$h" | grep -o '<video id="paperFilm"[^>]*>' | grep -o 'data-src="[^"]*"')"
          echo "::notice title=title::$(echo "$h" | grep -o 'Seven works.<br><em>[^<]*' | head -1)"
          echo "::notice title=data::$(curl -s "$U/paper-edition-data.js" | grep -o "closesAt:'[^']*'")"
          echo "::notice title=he::$(curl -s "$U/he/paper-edition/" | grep -o 'זמין עד [^<]*' | head -1)"
          echo "::notice title=mp4::$(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$U/assets/paper-edition-film-oct-v3-lite.mp4")"
