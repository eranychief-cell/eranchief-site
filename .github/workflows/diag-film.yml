name: diag-film
on:
  push:
    branches: [diag-film-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe live site
        run: |
          U=https://eranchief.com
          echo "::notice title=cta count::$(curl -s "$U/he/paper-edition/" | grep -o 'לבחירת גודל ורכישה' | wc -l) / old: $(curl -s "$U/he/paper-edition/" | grep -o 'להצגת היצירה בחדר' | wc -l)"
          echo "::notice title=en cta::$(curl -s "$U/paper-edition/" | grep -o 'Choose a size and buy' | wc -l)"
