name: diag-film
on:
  push:
    branches: [diag-film-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe live site
        run: |
          U=https://eranchief.com
          echo "::notice title=home pixel::$(curl -s "$U/he/" | grep -o "fbq('init','[0-9]*');fbq('track','PageView');[^<]\{0,60\}" | head -1)"
          echo "::notice title=paper pixel::$(curl -s "$U/he/paper-edition/" | grep -o "fbq('track','ViewContent'[^<]\{0,40\}" | head -1)"
          echo "::notice title=press::$(curl -s "$U/press/" | grep -o 'Channel 13 · Morning show · 11 May 2022\|RmC9u_Lb0XU' | sort -u | tr '\n' ' ')"
          echo "::notice title=he bari::$(curl -s "$U/he/born-and-raised-on-iphone/" | grep -o 'ערוץ 13 · פותחים יום · 11 במאי 2022\|לצפייה ביוטיוב' | sort -u | tr '\n' ' ')"
          echo "::notice title=privacy::$(curl -s "$U/privacy/" | grep -o 'Last updated: [^<]*\|פיקסל של מטא' | sort -u | tr '\n' ' ')"
          echo "::notice title=app events::$(curl -s "$U/app.js" | grep -o "fbq('track','[A-Za-z]*'" | sort -u | tr '\n' ' ')"
          echo "::notice title=app cache::$(curl -s -o /dev/null -D - "$U/app.js" | tr -d '\r' | grep -i 'cache-control' )"
          echo "::notice title=app tag::$(curl -s "$U/he/" | grep -o '<script[^>]*app.js[^>]*>' | head -2 | tr '\n' ' ')"
