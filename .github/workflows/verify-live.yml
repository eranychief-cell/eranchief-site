name: verify-live
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live return policy
        run: |
          t=$(date +%s)
          a=$(curl -sL "https://eranchief.com/artworks/terminal-3-216/?v=$t")
          h=$(curl -sL "https://eranchief.com/he/artworks/bad-hair-day-214/?v=$t")
          r=$(curl -s -o /dev/null -w '%{http_code}' "https://eranchief.com/shipping-returns/?v=$t")
          echo "::notice::en_notpermitted=$(grep -c 'MerchantReturnNotPermitted' <<<"$a") en_countries=$(grep -o '"applicableCountry":\[[^]]*\]' <<<"$a" | head -1) he_notpermitted=$(grep -c 'MerchantReturnNotPermitted' <<<"$h") returns_page=$r he_routes_still=$(curl -sL "https://eranchief.com/he/?v=$t" | grep -c 'he-route')"
