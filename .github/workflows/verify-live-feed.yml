name: verify-live-feed
on:
  push:
    branches: [verify-live-feed]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the New on the site strip is live
        run: |
          S=https://eranchief.com
          for i in $(seq 1 30); do curl -s "$S/?v=$i" | grep -q 'id="new-arrivals"' && break; sleep 15; done
          H=$(curl -s "$S/?x=2")
          echo "::notice::HOME section=$(echo "$H" | grep -c 'id="new-arrivals"') grid=$(echo "$H" | grep -c 'id="newArrivalsGrid"') app=$(echo "$H" | grep -o 'app.js?v=[0-9]*') css=$(echo "$H" | grep -o 'commerce.css?v=[0-9]*') he=$(echo "$H" | grep -o 'hebrew-ui.js?v=[0-9]*')"
          echo "::notice::APPJS newArrivals=$(curl -s "$S/app.js?v=58" | grep -c 'newArrivals') status=$(curl -s -o /dev/null -w '%{http_code}' "$S/app.js?v=58")"
          echo "::notice::CSS badge=$(curl -s "$S/commerce.css?v=4" | grep -c 'new-badge')"
          echo "::notice::HEUI $(curl -s "$S/hebrew-ui.js?v=23" | grep -o 'חדש באתר' | head -1)"
