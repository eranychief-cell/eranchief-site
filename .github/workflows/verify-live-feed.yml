name: verify-live-feed
on:
  push:
    branches: [verify-live-feed]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check work 205 now leads to work 1
        run: |
          S=https://eranchief.com
          for i in $(seq 1 30); do c=$(curl -s -o /dev/null -w '%{http_code}' "$S/artworks/color-before-the-storm-205/"); [ "$c" = "301" ] && break; sleep 15; done
          echo "::notice::EN $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' $S/artworks/color-before-the-storm-205/)"
          echo "::notice::HE $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' $S/he/artworks/color-before-the-storm-205/)"
          echo "::notice::TARGET $(curl -s -o /dev/null -w '%{http_code}' $S/he/artworks/colors-before-the-storm-1/)"
          echo "::notice::FEED 205=$(curl -s $S/google-merchant-feed.xml | grep -o 'CHIEF-205' | wc -l) 1=$(curl -s $S/google-merchant-feed.xml | grep -o 'CHIEF-1<' | wc -l)"
          echo "::notice::SITEMAP 205=$(curl -s $S/sitemap.xml | grep -c 'color-before-the-storm-205')"
          echo "::notice::LOBBY $(curl -s $S/lobby-art/ | grep -o 'colors-before-the-storm-1/' | head -1) old=$(curl -s $S/lobby-art/ | grep -c 'color-before-the-storm-205')"
          echo "::notice::APPJS has205=$(curl -s "$S/app.js?v=58&r=$RANDOM" | grep -c 'id:205,')"
