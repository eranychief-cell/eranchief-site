name: live-check-lightning
on:
  push:
    branches: [tmp/live-check-lightning]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 20
          for u in https://eranchief.com/he/jaffa-15-years/ https://eranchief.com/jaffa-15-years/ https://eranchief.com/he/jaffa-15-years/journey/ https://eranchief.com/jaffa-15-years/journey/ https://eranchief.com/jaffa-15-years/img/full/jaffa-2026-lightning-strikes-the-sea.jpg; do
            code=$(curl -s -o /tmp/p -w '%{http_code}' -H 'Cache-Control: no-cache' "$u?v=$RANDOM")
            n1=$(grep -c 'lightning-strikes-the-sea' /tmp/p || true)
            n2=$(grep -o 'הברק מכה פעמיים\|Lightning Strikes Twice' /tmp/p | sort | uniq -c | tr '\n' ' ')
            n3=$(grep -o 'data-to="46"\|>46<' /tmp/p | head -2 | tr '\n' ' ')
            echo "::notice::$u code=$code lightning_refs=$n1 titles=[$n2] count46=[$n3]"
          done
