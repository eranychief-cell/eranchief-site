name: verify-live-pdf
on:
  push:
    branches: [verify-live-pdf]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the corporate gifts PDF on the live site
        run: |
          U=https://eranchief.com/assets/review/chief-corporate-gifts-2027-6534813190f2.pdf
          for i in $(seq 1 20); do c=$(curl -s -o /dev/null -w '%{http_code}' $U); [ "$c" = 200 ] && break; sleep 15; done
          echo "::notice::pdf status=$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' $U)"
          echo "::notice::pdf robots=$(curl -sI $U | grep -i x-robots-tag | tr -d '\r')"
          echo "::notice::home status=$(curl -s -o /dev/null -w '%{http_code}' https://eranchief.com/)"
