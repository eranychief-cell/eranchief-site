name: verify-live-pdf
on:
  push:
    branches: [verify-live-pdf]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check payment status and paper edition on the live site
        run: |
          echo "::notice::grow_status $(curl -s https://eranchief.com/api/grow/status)"
          echo "::notice::grow_status_test $(curl -s 'https://eranchief.com/api/grow/status?growtest=1')"
          echo "::notice::paper_page status=$(curl -s -o /dev/null -w '%{http_code}' https://eranchief.com/paper-edition/) closesAt=$(curl -s https://eranchief.com/paper-edition-data.js | grep -o "closesAt:'[^']*'")"
          echo "::notice::home has paper link=$(curl -s https://eranchief.com/ | grep -o -i 'paper' | wc -l)"
