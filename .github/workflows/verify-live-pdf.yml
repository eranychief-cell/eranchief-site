name: verify-live-pdf
on:
  push:
    branches: [verify-live-pdf]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Bored Panda additions on the live site
        run: |
          sleep 30
          for u in press/ press-kit/ born-and-raised-on-iphone/ he/born-and-raised-on-iphone/ ""; do
            body=$(curl -s "https://eranchief.com/$u")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://eranchief.com/$u")
            echo "::notice::/$u status=$code boredpanda_links=$(echo "$body" | grep -o 'stunning-iphone-photography-chieferanyerushalmi' | wc -l) yahoo=$(echo "$body" | grep -o 'photographer-took-30-000' | wc -l)"
          done
